# This is a Databricks asset bundle definition for myfirstproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: myfirstproject
  uuid: 40a83bbe-12a8-4d43-9b1b-13d096dcf6cc

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: catalog1_we47
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/ketanchoudhary1011@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ketanchoudhary1011@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: catalog1_we47
      schema: prod
    permissions:
      - user_name: ketanchoudhary1011@gmail.com
        level: CAN_MANAGE
